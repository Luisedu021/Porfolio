# Publica o site no GitHub Pages a cada push na main: https://luisedu021.github.io/Porfolio/
# Quando a API (backend/) estiver no ar, crie a variável do repositório VITE_API_URL
# (Settings → Secrets and variables → Actions → Variables) com o endereço dela.
name: Deploy do site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # O site fica em /Porfolio/ (nome do repositório), não na raiz do domínio.
      - run: npm run build -- --base=/Porfolio/
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
