<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- O site tem tema claro e escuro próprios: impede o navegador de "escurecer" o tema claro sozinho. -->
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Luís Eduardo — UI/UX Designer, Product Designer e Desenvolvedor Fullstack."
    />
    <title>Luís Eduardo — UI/UX Designer & Fullstack Developer</title>
    <script>
      // Aplica tema e idioma antes da página aparecer (evita "piscar" a cor errada).
      try {
        var theme = localStorage.getItem('theme')
        var dark = theme ? theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('dark', dark)
        var lang = localStorage.getItem('lang') || 'pt'
        document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en'
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
